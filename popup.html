<!DOCTYPE html>
<html>
<head>
  <style>
    body { 
      width: 400px; 
      height: 400px; 
      margin: 0; 
      background: #222; 
      color: white; 
      display: flex; 
      flex-direction: column;
      align-items: center; 
      justify-content: center;
      font-family: sans-serif;
    }
    #container {
      position: relative;
      width: 360px;
      height: 270px;
      border: 2px solid #444;
      border-radius: 8px;
      overflow: hidden;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    canvas {
      position: absolute;
      top: 0;
      left: 0;
    }
    h2 { margin: 10px 0; font-size: 18px; }
    #status { color: yellow; font-weight: bold; }
  </style>
</head>
<body>
  <h2>Status: <span id="status">Loading Face Tracker...</span></h2>
  
  <div id="container">
    <video id="video" autoplay muted></video>
  </div>

  <script src="face-api.min.js"></script>
  
  <script src="popup.js"></script>
</body>
</html>
